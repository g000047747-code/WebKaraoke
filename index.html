<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.all.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const NN=['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
const nm=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
const HOP=.05,WIN=7;
let ctx,songFile,title='',ref=null,stat=null,inst=null,src=null,t0=0,playing=false,mic=null,an=null,rec=null,chunks=[],recT=0,raf=0,user=[],lo=48,hi=72,sm=null,cH=0,cM=0,vibT=0,lastF=performance.now(),rblob=null,rscore=0,rbonus=0,rpct=0;

// ---------- storage (cookieは4KB制限のため localStorage + IndexedDB を使用) ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('okk',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=rej});
const idb=(m,k,v)=>dbp.then(d=>new Promise((res,rej)=>{const s=d.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f');const q=m=='get'?s.get(k):m=='put'?s.put(v,k):m=='del'?s.delete(k):s.clear();q.onsuccess=()=>res(q.result);q.onerror=rej}));
const meta=()=>{try{return JSON.parse(localStorage.okh||'[]')}catch{return[]}};
const setMeta=a=>localStorage.okh=JSON.stringify(a);

// ---------- pitch (YIN) ----------
function yin(x,sr){
 const W=x.length>>1,mn=Math.floor(sr/800),mx=Math.min(Math.floor(sr/80),W-1);
 let e=0;for(let i=0;i<x.length;i++)e+=x[i]*x[i];if(e/x.length<2e-5)return 0;
 const d=new Float32Array(mx+2);let run=0;
 for(let t=1;t<=mx;t++){let s=0;for(let j=0;j<W;j++){const v=x[j]-x[j+t];s+=v*v}run+=s;d[t]=s*t/(run||1)}
 for(let t=Math.max(2,mn);t<mx;t++){if(d[t]<.15){while(t+1<mx&&d[t+1]<d[t])t++;
  const a=d[t-1],b=d[t],c=d[t+1],den=2*(a-2*b+c),p=t+(den?(a-c)/den:0);return 12*Math.log2(sr/p/440)+69}}
 return 0}

function mkInst(buf){
 const L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,o=ctx.createBuffer(2,L.length,buf.sampleRate),a=o.getChannelData(0),b=o.getChannelData(1);
 let lp=0;for(let i=0;i<L.length;i++){const m=(L[i]+R[i])/2;lp+=.028*(m-lp);const v=(L[i]-R[i])/2+lp;a[i]=b[i]=v*1.2}
 return o}

async function analyze(buf){
 const L=buf.getChannelData(0),R=buf.numberOfChannels>1?buf.getChannelData(1):L,sr=buf.sampleRate,k=Math.max(1,Math.round(sr/11025)),n=1024,hop=Math.round(sr*HOP),N=Math.max(1,Math.floor((L.length-n*k)/hop));
 const mid=new Float32Array(L.length);for(let i=0;i<L.length;i++)mid[i]=(L[i]+R[i])/2;
 const r=new Float32Array(N),x=new Float32Array(n);
 for(let f=0;f<N;f++){const s=f*hop;for(let i=0;i<n;i++){let a=0;for(let q=0;q<k;q++)a+=mid[s+i*k+q];x[i]=a/k}
  r[f]=yin(x,sr/k);if(f%80==0){$('#msg').textContent='音程を解析中 '+Math.round(f/N*100)+'%';await new Promise(z=>setTimeout(z))}}
 for(let f=1;f<N-1;f++)if(r[f]&&!r[f-1]&&!r[f+1])r[f]=0;
 const v=[...r].filter(Boolean).sort((a,b)=>a-b);
 if(v.length<20)throw new Error('歌声の音程を検出できませんでした');
 lo=Math.floor(v[Math.floor(v.length*.04)])-3;hi=Math.ceil(v[Math.floor(v.length*.96)])+3;
 if(hi-lo<14){const c=(hi+lo)/2;lo=Math.floor(c-7);hi=Math.ceil(c+7)}
 return r}

// ---------- AI分離 (UVR MDX-Net ONNX / onnxruntime-web) ----------
/*DSP*/
const HP=1024,MARG=22050,COMP=1.035;let DF,NF,N2,P,DT=256,tw,br,win,FA,FB;
function setDF(df){DF=df;NF=2*df;N2=1;while(NF%(N2*2)==0)N2*=2;P=NF/N2;
 tw=new Float32Array(NF*2);for(let k=0;k<NF;k++){tw[2*k]=Math.cos(2*Math.PI*k/NF);tw[2*k+1]=-Math.sin(2*Math.PI*k/NF)}
 br=new Uint16Array(N2);const b=Math.log2(N2);for(let i=0;i<N2;i++){let r=0;for(let j=0;j<b;j++)if(i>>j&1)r|=1<<(b-1-j);br[i]=r}
 win=new Float32Array(NF);for(let i=0;i<NF;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/NF);
 FA=Array.from({length:P},()=>new Float32Array(N2));FB=Array.from({length:P},()=>new Float32Array(N2))}
function fft2k(re,im){
 for(let i=0;i<N2;i++){const j=br[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let s=2;s<=N2;s<<=1){const h=s>>1,st=N2/s*P;
  for(let i=0;i<N2;i+=s)for(let k=0;k<h;k++){const wr=tw[2*k*st],wi=tw[2*k*st+1],a=i+k,b=a+h,xr=re[b]*wr-im[b]*wi,xi=re[b]*wi+im[b]*wr;re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi}}}
function fft(re,im){
 for(let r=0;r<P;r++){for(let m=0;m<N2;m++){FA[r][m]=re[P*m+r];FB[r][m]=im[P*m+r]}fft2k(FA[r],FB[r])}
 for(let q=0;q<P;q++)for(let k=0;k<N2;k++){let sr=0,si=0;for(let r=0;r<P;r++){const ix=(r*(k+N2*q))%NF,wr=tw[2*ix],wi=tw[2*ix+1],ar=FA[r][k],ai=FB[r][k];sr+=ar*wr-ai*wi;si+=ar*wi+ai*wr}re[k+N2*q]=sr;im[k+N2*q]=si}}
function stft(x){const L=x.length,Rr=new Float32Array(DF*DT),Ii=new Float32Array(DF*DT),re=new Float32Array(NF),im=new Float32Array(NF);
 for(let t=0;t<DT;t++){const st=t*HP-NF/2;
  for(let i=0;i<NF;i++){let j=st+i;if(j<0)j=-j;if(j>=L)j=2*(L-1)-j;re[i]=(j>=0&&j<L?x[j]:0)*win[i];im[i]=0}
  fft(re,im);for(let k=0;k<DF;k++){Rr[k*DT+t]=re[k];Ii[k*DT+t]=im[k]}}
 return[Rr,Ii]}
function istft(Rr,Ii){const SEG=HP*(DT-1),out=new Float32Array(SEG),nm=new Float32Array(SEG),re=new Float32Array(NF),im=new Float32Array(NF);
 for(let t=0;t<DT;t++){
  for(let k=0;k<DF;k++){re[k]=Rr[k*DT+t];im[k]=-Ii[k*DT+t]}re[DF]=0;im[DF]=0;
  for(let k=DF+1;k<NF;k++){re[k]=re[NF-k];im[k]=-im[NF-k]}
  fft(re,im);const st=t*HP-NF/2;
  for(let i=0;i<NF;i++){const j=st+i;if(j>=0&&j<SEG){const w=win[i];out[j]+=re[i]/NF*w;nm[j]+=w*w}}}
 for(let j=0;j<SEG;j++)if(nm[j]>1e-6)out[j]/=nm[j];return out}
setDF(2560);
/*ENDDSP*/
let sess=null,cancelSep=false,cancelRej=null;
const runC=p=>Promise.race([p,new Promise((_,j)=>{cancelRej=j})]);
function mkCtx(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;try{ctx=new A({sampleRate:44100})}catch{ctx=new A()}}return ctx}
async function rs44(b){if(b.sampleRate==44100&&b.numberOfChannels==2)return b;const oc=new OfflineAudioContext(2,Math.ceil(b.duration*44100),44100),s=oc.createBufferSource();s.buffer=b;s.connect(oc.destination);s.start();return oc.startRendering()}
async function getSess(){
 if(sess)return sess;const blob=await idb('get','model');if(!blob)return null;
 ort.env.wasm.wasmPaths='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
 const eps={executionProviders:location.hash=='#webgpu'?['webgpu','wasm']:['wasm']};
 try{ort.env.wasm.proxy=true;sess=await ort.InferenceSession.create(new Uint8Array(await blob.arrayBuffer()),eps)}
 catch{ort.env.wasm.proxy=false;sess=await ort.InferenceSession.create(new Uint8Array(await blob.arrayBuffer()),eps)}
 try{const m=sess.inputMetadata,sh=(Array.isArray(m)?m[0]:m[sess.inputNames[0]]).shape;
  if(sh&&typeof sh[2]=='number'&&sh[2]>0&&sh[2]!==DF)setDF(sh[2]);
  if(sh&&typeof sh[3]=='number'&&sh[3]>0)DT=sh[3]}catch{}
 return sess}
async function separate(buf){
 $('#msg').textContent='モデルの動作確認中…（数十秒かかることがあります）';
 const t1=performance.now(),iv=setInterval(()=>{$('#msg').textContent='モデルの動作確認中…（経過 '+Math.round((performance.now()-t1)/1000)+'秒）'},1000);
 try{for(let tr=0;tr<4;tr++){try{await runC(sess.run({[sess.inputNames[0]]:new ort.Tensor('float32',new Float32Array(4*DF*DT),[1,4,DF,DT])}));break}
  catch(e){const m=/index: (\d+) Got: \d+\s+Expected: (\d+)/.exec(e.message||'');if(!m||tr==3)throw e;if(m[1]==2)setDF(+m[2]);else if(m[1]==3)DT=+m[2];else throw e}}}finally{clearInterval(iv)}
 const L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,SEG=HP*(DT-1),step=SEG-2*MARG,K=Math.ceil(n/step),Z=DF*DT;
 const iL=new Float32Array(n),iR=new Float32Array(n),T0=performance.now();
 for(let k=0;k<K;k++){
  if(cancelSep)throw new Error('cancel');
  const s0=k*step-MARG,cl=new Float32Array(SEG),cr=new Float32Array(SEG);
  for(let i=0;i<SEG;i++){const j=s0+i;if(j>=0&&j<n){cl[i]=L[j];cr[i]=R[j]}}
  const a=stft(cl),b=stft(cr),inp=new Float32Array(4*Z);inp.set(a[0],0);inp.set(a[1],Z);inp.set(b[0],2*Z);inp.set(b[1],3*Z);
  const o=(await runC(sess.run({[sess.inputNames[0]]:new ort.Tensor('float32',inp,[1,4,DF,DT])})))[sess.outputNames[0]].data;
  const yl=istft(o.subarray(0,Z),o.subarray(Z,2*Z)),yr=istft(o.subarray(2*Z,3*Z),o.subarray(3*Z,4*Z));
  for(let i=0;i<step;i++){const j=k*step+i;if(j<n){iL[j]=yl[MARG+i]*COMP;iR[j]=yr[MARG+i]*COMP}}
  const rem=(K-k-1)*(performance.now()-T0)/(k+1)/60000;$('#msg').textContent='AIで歌声を分離中 '+(k+1)+' / '+K+'（残り約'+Math.ceil(rem)+'分）';await new Promise(z=>setTimeout(z))}
 const io=ctx.createBuffer(2,n,44100),vo=ctx.createBuffer(1,n,44100),vd=vo.getChannelData(0);
 io.copyToChannel(iL,0);io.copyToChannel(iR,1);for(let i=0;i<n;i++)vd[i]=((L[i]-iL[i])+(R[i]-iR[i]))/2;
 return{inst:io,voc:vo}}
const i16=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++)o[i]=Math.max(-1,Math.min(1,a[i]))*32767;return o};
function fromCache(c){const b=ctx.createBuffer(2,c.l.length,c.sr),f=new Float32Array(c.l.length);
 for(let i=0;i<f.length;i++)f[i]=c.l[i]/32767;b.copyToChannel(f,0);for(let i=0;i<f.length;i++)f[i]=c.r[i]/32767;b.copyToChannel(f,1);return b}

// ---------- load ----------
$('#mfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{await idb('put','model',f);sess=null;$('#msg').textContent='モデルを保存しました（'+f.name+'）。曲を選ぶとAI分離が使われます'}catch{$('#msg').textContent='モデルを保存できませんでした'}};
$('#file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;mkCtx();ctx.resume();
 title=(prompt('保存時のタイトルを入力してください',f.name.replace(/\.[^.]+$/,''))||f.name).trim();
 songFile=f;$('#ttl').textContent=title;$('#go').disabled=true;ref=null;
 try{$('#msg').textContent='読み込み中…';const dec=await ctx.decodeAudioData(await f.arrayBuffer()),key='c'+f.name+'_'+f.size;
  let c=null;try{c=await idb('get',key)}catch{}
  if(c){inst=fromCache(c);ref=c.ref;lo=c.lo;hi=c.hi}
  else{let s=null;
   if(typeof ort!='undefined'){$('#msg').textContent='モデルを読み込み中…（初回は1分ほどかかります）';try{s=await getSess()}catch(er){$('#msg').textContent='モデルエラー: '+er.message;await new Promise(z=>setTimeout(z,1800))}}
   if(s){cancelSep=false;$('#cxl').style.display='';let r=null;
    try{r=await separate(await rs44(dec))}catch(er){if(er.message!='cancel'){$('#cxl').style.display='none';throw er}}
    $('#cxl').style.display='none';
    if(r){inst=r.inst;$('#msg').textContent='音程を解析中…';ref=await analyze(r.voc);
     try{await idb('put',key,{sr:44100,l:i16(inst.getChannelData(0)),r:i16(inst.getChannelData(1)),ref,lo,hi})}catch{}}
    else{inst=mkInst(dec);ref=await analyze(dec);$('#msg').textContent='簡易モード（AI分離なし）'}}
   else{inst=mkInst(dec);ref=await analyze(dec);$('#msg').textContent='簡易モード（モデル未設定）'}}
  stat=new Uint8Array(ref.length);$('#msg').textContent='準備OK（'+Math.round(dec.duration)+'秒）';$('#go').disabled=false;draw(0)
 }catch(err){$('#msg').textContent='エラー: '+err.message}
};
$('#cxl').onclick=()=>{cancelSep=true;if(cancelRej)cancelRej(new Error('cancel'))};
$('#lat').oninput=e=>$('#latv').textContent=e.target.value+'ms';

// ---------- sing ----------
$('#go').onclick=()=>playing?finish():start();
async function start(){
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
 catch{$('#msg').textContent='マイクを許可してください';return}
 ctx.resume();const ms=ctx.createMediaStreamSource(mic);an=ctx.createAnalyser();an.fftSize=4096;ms.connect(an);
 rec=new MediaRecorder(mic);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.start();recT=ctx.currentTime;
 stat=new Uint8Array(ref.length);user=[];cH=cM=vibT=0;sm=null;
 src=ctx.createBufferSource();src.buffer=inst;src.connect(ctx.destination);src.onended=()=>{if(playing)finish()};
 t0=ctx.currentTime+.3;src.start(t0);playing=true;$('#go').textContent='■ 終了';$('#file').disabled=true;lastF=performance.now();loop()}

const tb=new Float32Array(4096),xb=new Float32Array(1024);
function loop(){
 raf=requestAnimationFrame(loop);const now=performance.now(),dt=(now-lastF)/1000;lastF=now;
 const t=ctx.currentTime-t0;if(t<0){draw(t);return}
 an.getFloatTimeDomainData(tb);for(let i=0;i<1024;i++)xb[i]=(tb[i*4]+tb[i*4+1]+tb[i*4+2]+tb[i*4+3])/4;
 let m=yin(xb,ctx.sampleRate/4);
 const rt=t-$('#lat').value/1000,fi=Math.floor(rt/HOP),rm=(fi>=0&&fi<ref.length)?ref[fi]:0;
 if(m){m+=12*Math.round(((rm||(lo+hi)/2)-m)/12);sm=sm==null?m:sm+(m-sm)*.35}else sm=null;
 user.push({t,m:sm});while(user.length&&user[0].t<t-WIN)user.shift();
 if(rm&&fi<stat.length){const old=stat[fi],nw=(sm!=null&&Math.abs(sm-rm)<=1)?1:2;
  if(old!=1&&old!=nw){if(old==2)cM--;if(nw==1)cH++;else cM++;stat[fi]=nw}}
 // ビブラート検出: 直近1秒の揺れ(約4-9Hz, 振幅0.3〜2.5半音)
 const w=user.filter(u=>u.t>t-1);if(w.length>30&&w.every(u=>u.m!=null)){
  const av=w.reduce((a,u)=>a+u.m,0)/w.length;let z=0,mn=1e9,mxv=-1e9;
  for(let i=1;i<w.length;i++)if((w[i].m-av)*(w[i-1].m-av)<0)z++;
  w.forEach(u=>{mn=Math.min(mn,u.m);mxv=Math.max(mxv,u.m)});
  if(z>=7&&z<=18&&mxv-mn>.4&&mxv-mn<2.5)vibT+=dt}
 $('#live').textContent=(cH+cM?Math.round(cH/(cH+cM)*100):0)+'%';
 draw(t)}

function finish(){
 if(!playing)return;playing=false;cancelAnimationFrame(raf);try{src.stop()}catch{}
 const played=Math.min(ref.length,Math.floor((ctx.currentTime-t0-$('#lat').value/1000)/HOP));let tot=0,h=0;
 for(let f=0;f<played;f++)if(ref[f]){tot++;if(stat[f]==1)h++}
 rpct=tot?h/tot:0;rbonus=Math.min(5,vibT*.5);rscore=Math.min(100,Math.round((Math.min(100,rpct*110)+rbonus)*10)/10);
 rec.onstop=()=>{rblob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});showRes()};rec.stop();mic.getTracks().forEach(x=>x.stop());
 $('#go').textContent='▶ スタート';$('#file').disabled=false}

function showRes(){
 $('#rtitle').textContent=title;$('#big').textContent=rscore.toFixed(1);
 $('#rinfo').textContent='音程一致 '+Math.round(rpct*100)+'% ／ ビブラート加点 +'+rbonus.toFixed(1);
 $('#raud').src=URL.createObjectURL(rblob);$('#rname').value=title;$('#res').classList.add('on')}
$('#rdis').onclick=()=>{$('#raud').pause();$('#res').classList.remove('on');stat=new Uint8Array(ref.length);draw(0)};
$('#rsave').onclick=async()=>{
 const id=Date.now()+'',sk=songFile.name+'_'+songFile.size;
 await idb('put','r'+id,rblob);if(!(await idb('get','s'+sk)))await idb('put','s'+sk,songFile);
 const a=meta();a.unshift({id,date:new Date().toISOString(),title:$('#rname').value.trim()||title,score:rscore,sk,off:t0-recT,mime:rblob.type});setMeta(a);
 $('#raud').pause();$('#res').classList.remove('on');stat=new Uint8Array(ref.length);draw(0)};

// ---------- history ----------
let hsrc=[];
function stopH(){hsrc.forEach(s=>{try{s.stop()}catch{}});hsrc=[];$('#hp').style.display='none'}
function render(){const a=meta(),l=$('#list');l.innerHTML='';
 if(!a.length){l.innerHTML='<div class="c" style="opacity:.7;padding:20px">まだ記録がありません。歌って「保存する」を押すとここに並びます。</div>';return}
 a.forEach(r=>{const d=new Date(r.date),e=document.createElement('div');e.className='row';
  e.innerHTML='<div class="t"><b></b><small>'+d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</small></div><div class="s">'+r.score.toFixed(1)+'</div><button>▶</button><button>🗑</button>';
  e.querySelector('b').textContent=r.title;const[bp,bd]=e.querySelectorAll('button');
  bp.onclick=()=>playH(r);bd.onclick=async()=>{if(!confirm('「'+r.title+'」を削除しますか？'))return;stopH();await idb('del','r'+r.id);
   const rest=meta().filter(x=>x.id!=r.id);if(!rest.some(x=>x.sk==r.sk)){await idb('del','s'+r.sk);await idb('del','c'+r.sk)}setMeta(rest);render()};
  l.appendChild(e)})}
$('#hbtn').onclick=()=>{if(playing)return;render();$('#his').classList.add('on')};
$('#hclose').onclick=()=>{stopH();$('#his').classList.remove('on')};
$('#hall').onclick=async()=>{if(!confirm('履歴と録音をすべて削除します。よろしいですか？'))return;stopH();const mdl=await idb('get','model');await idb('clear');if(mdl)await idb('put','model',mdl);localStorage.removeItem('okh');render()};
$('#hstop').onclick=stopH;
let gv,gi;
async function playH(r){
 stopH();ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
 const [rb,sf]=await Promise.all([idb('get','r'+r.id),idb('get','s'+r.sk)]);
 if(!rb||!sf){alert('音声データが見つかりません');return}
 const vb=await ctx.decodeAudioData(await rb.arrayBuffer()),cc=await idb('get','c'+r.sk),ib=cc?fromCache(cc):mkInst(await ctx.decodeAudioData(await sf.arrayBuffer()));
 gv=ctx.createGain();gi=ctx.createGain();gv.connect(ctx.destination);gi.connect(ctx.destination);
 gv.gain.value=$('#vv').value;gi.gain.value=$('#vi').value;
 const a=ctx.createBufferSource(),b=ctx.createBufferSource();a.buffer=vb;b.buffer=ib;a.connect(gv);b.connect(gi);
 const w=ctx.currentTime+.1;a.start(w);b.start(w+(r.off||0));hsrc=[a,b];a.onended=()=>{if(hsrc[0]===a)stopH()};
 $('#hpn').textContent='再生中: '+r.title;$('#hp').style.display='flex'}
$('#vv').oninput=e=>{if(gv)gv.gain.value=e.target.value};$('#vi').oninput=e=>{if(gi)gi.gain.value=e.target.value};

// ---------- draw ----------
const cv=$('#cv'),g=cv.getContext('2d');let cw=0,ch=0;
function fit(){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cw=r.width;ch=r.height;cv.width=cw*d;cv.height=ch*d;g.setTransform(d,0,0,d,0,0);if(!playing)draw(0)}
addEventListener('resize',fit);
const BLK=[1,3,6,8,10];
function draw(t){
 g.clearRect(0,0,cw,ch);const LW=46,nowX=LW+(cw-LW)*.25,pps=(cw-LW)/WIN,n=hi-lo+1,rh=ch/n,yOf=m=>ch-(m-lo+.5)*rh,xOf=s=>nowX+(s-t)*pps;
 for(let m=lo;m<=hi;m++){const y=yOf(m)-rh/2;g.fillStyle=BLK.includes(((m%12)+12)%12)?'rgba(0,0,0,.18)':'rgba(255,255,255,.04)';g.fillRect(LW,y,cw-LW,rh);
  if(m%12==0){g.fillStyle='rgba(255,255,255,.18)';g.fillRect(LW,y+rh-1,cw-LW,1)}
  g.fillStyle='rgba(255,255,255,.75)';g.font=Math.max(9,Math.min(13,rh*.7))+'px sans-serif';g.textBaseline='middle';if(rh>11||m%12==0)g.fillText(nm(m),6,yOf(m))}
 if(!ref){g.fillStyle='rgba(255,255,255,.7)';g.font='16px sans-serif';g.textAlign='center';g.fillText('下の「曲を選ぶ」からmp3をアップロード',cw/2,ch/2);g.textAlign='left';return}
 const f0=Math.max(0,Math.floor((t-.25*WIN)/HOP)),f1=Math.min(ref.length,Math.ceil((t+.75*WIN)/HOP)),bw=HOP*pps+.6,bh=rh*.72;
 for(let f=f0;f<f1;f++){const m=ref[f];if(!m)continue;const x=xOf(f*HOP),y=yOf(Math.round(m))-bh/2,s=stat[f];
  if(s==1){g.fillStyle='#ffd84a';g.shadowColor='#ffd84a';g.shadowBlur=10}else if(s==2){g.fillStyle='#ff4d6d';g.shadowBlur=0}else{g.fillStyle='rgba(255,255,255,.32)';g.shadowBlur=0}
  g.fillRect(x,y,bw,bh)}
 g.shadowBlur=0;
 g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(nowX,0);g.lineTo(nowX,ch);g.stroke();
 g.lineWidth=Math.max(4,rh*.45);g.lineCap='round';g.lineJoin='round';g.strokeStyle='#5ff3ff';g.shadowColor='#5ff3ff';g.shadowBlur=14;
 let pen=false,lx=0,ly=0;g.beginPath();
 for(const u of user){if(u.m==null){pen=false;continue}const x=xOf(u.t),y=yOf(u.m);
  if(!pen){g.moveTo(x,y);pen=true}else g.quadraticCurveTo(lx,ly,(lx+x)/2,(ly+y)/2);lx=x;ly=y}
 g.stroke();g.shadowBlur=0;
 const last=user[user.length-1];if(last&&last.m!=null){const y=yOf(last.m);g.fillStyle='#fff';g.beginPath();g.arc(nowX,y,Math.max(6,rh*.4),0,7);g.fill();
  g.font='bold 14px sans-serif';g.fillStyle='#fff';g.fillText(nm(Math.round(last.m)),nowX+14,y-14)}
}
